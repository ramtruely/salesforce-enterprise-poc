name: Enterprise PR Validation

on:
  workflow_call:
    inputs:
      target_env:
        required: true
        type: string
        
    secrets:
      SF_AUTH_TEST:
        required: true

      SF_AUTH_LOAD:
        required: true

jobs:

  # ---------------------------------------------------
  # 1. Detect Context
  # ---------------------------------------------------
  detect-context:
    runs-on: ubuntu-latest

    outputs:
      validation_mode: ${{ steps.validation-mode.outputs.mode }}
      target_env: ${{ steps.env-detect.outputs.env }}
      first_pr: ${{ steps.pr-detect.outputs.first_pr }}

    steps:
      - uses: actions/checkout@v3

      # -----------------------------------------------
      # Detect Environment
      # -----------------------------------------------
      - name: Detect Environment
        id: env-detect
        run: |
          echo "env=${{ inputs.target_env }}" >> $GITHUB_OUTPUT

      # -----------------------------------------------
      # Detect First PR
      # -----------------------------------------------
      - name: Detect First PR
        id: pr-detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_COUNT=$(gh pr list \
            --base ${{ github.base_ref }} \
            --state merged \
            --json number \
            --jq length)

          echo "Merged PR Count: $PR_COUNT"

          if [ "$PR_COUNT" -eq 0 ]; then
            echo "first_pr=true" >> $GITHUB_OUTPUT
          else
            echo "first_pr=false" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------
      # Detect First Deployment
      # -----------------------------------------------
      - name: Check Deployment Cache
        id: cache-check
        uses: actions/cache@v4
        with:
          path: .deploy_marker_${{ steps.env-detect.outputs.env }}
          key: deploy-marker-${{ steps.env-detect.outputs.env }}-v1

      # -----------------------------------------------
      # Set Validation Mode
      # -----------------------------------------------
      - name: Set Validation Mode
        id: validation-mode
        run: |
          if [ "${{ steps.pr-detect.outputs.first_pr }}" == "true" ] || \
             [ "${{ steps.cache-check.outputs.cache-hit }}" != "true" ]; then

            echo "mode=bootstrap" >> $GITHUB_OUTPUT

          else
            echo "mode=full" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------
      # Debug Context
      # -----------------------------------------------
      - name: Debug Context
        run: |
          echo "Environment: ${{ steps.env-detect.outputs.env }}"
          echo "First PR: ${{ steps.pr-detect.outputs.first_pr }}"
          echo "Cache Hit: ${{ steps.cache-check.outputs.cache-hit }}"
          echo "Validation Mode: ${{ steps.validation-mode.outputs.mode }}"

  # ---------------------------------------------------
  # 2. Mandatory Checks
  # ---------------------------------------------------
  mandatory-checks:
    runs-on: ubuntu-latest
    needs: detect-context

    steps:
      - uses: actions/checkout@v3

      - name: Commit Message Validation
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "$TITLE" | grep -E "^(feat|fix|chore|test|refactor):" || exit 1

      - name: YAML Syntax Validation
        run: echo "YAML validation passed"

      - name: Deployment Authentication Validation
        run: echo "Authentication validation passed"

      - name: Basic Validation
        run: echo "Basic validation passed"

  # ---------------------------------------------------
  # 3. Non-Skippable Enterprise Checks
  # ---------------------------------------------------

  pr-title-validation:
    runs-on: ubuntu-latest
    needs: mandatory-checks

    steps:
      - name: PR Title Validation
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "$TITLE" | grep -E "^(feat|fix|chore|test|refactor):" || exit 1

  duplicate-metadata-check:
    runs-on: ubuntu-latest
    needs: mandatory-checks

    steps:
      - name: Duplicate Metadata Detection
        run: echo "No duplicate metadata found"

  basic-pmd:
    runs-on: ubuntu-latest
    needs: mandatory-checks

    steps:
      - name: Basic PMD Validation
        run: echo "Basic PMD validation passed"

  secret-scan:
    runs-on: ubuntu-latest
    needs: mandatory-checks

    steps:
      - name: Secret Scan
        run: echo "No secrets detected"

  metadata-structure-validation:
    runs-on: ubuntu-latest
    needs: mandatory-checks

    steps:
      - name: Metadata Structure Validation
        run: echo "Metadata structure validated"

  basic-lint:
    runs-on: ubuntu-latest
    needs: mandatory-checks

    steps:
      - name: Basic Lint Validation
        run: echo "Basic lint validation passed"

  file-naming-validation:
    runs-on: ubuntu-latest
    needs: mandatory-checks

    steps:
      - name: File Naming Validation
        run: echo "File naming convention validated"

  # ---------------------------------------------------
  # 4. Conditional Heavy Checks
  # ---------------------------------------------------

  sfca-analyzer:
    runs-on: ubuntu-latest
    needs: [detect-context, mandatory-checks]
    if: needs.detect-context.outputs.validation_mode == 'full'

    steps:
      - name: SFCA Analyzer
        run: echo "Running SFCA analyzer"

  risk-assessment:
    runs-on: ubuntu-latest
    needs: [detect-context, mandatory-checks]
    if: needs.detect-context.outputs.validation_mode == 'full'

    steps:
      - name: Calculate Risk Assessment
        run: echo "Running risk assessment"

  package-coverage:
    runs-on: ubuntu-latest
    needs: [detect-context, mandatory-checks]
    if: needs.detect-context.outputs.validation_mode == 'full'

    steps:
      - name: Package Coverage Check
        run: echo "Running package coverage"

  dev-risk-profile:
    runs-on: ubuntu-latest
    needs: [detect-context, mandatory-checks]
    if: needs.detect-context.outputs.validation_mode == 'full'

    steps:
      - name: Dev Risk Profile
        run: echo "Running dev risk profile"

  sf-unit-test-gate:
    runs-on: ubuntu-latest
    needs: [detect-context, mandatory-checks]
    if: needs.detect-context.outputs.validation_mode == 'full'

    steps:
      - name: SF Unit Test Gate
        run: echo "Running SF unit test gate"

  modified-class-coverage:
    runs-on: ubuntu-latest
    needs: [detect-context, mandatory-checks]
    if: needs.detect-context.outputs.validation_mode == 'full'

    steps:
      - name: SF Coverage Gate for Modified Classes
        run: echo "Running modified class coverage"

  # ---------------------------------------------------
  # 5. TEST Validation
  # ---------------------------------------------------
  test-org-validation:
    runs-on: ubuntu-latest
    needs:
      - mandatory-checks
      - detect-context

    if: needs.detect-context.outputs.target_env == 'TEST'

    steps:
      - uses: actions/checkout@v3

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate TEST
        run: |
          echo "${{ secrets.SF_AUTH_TEST }}" > auth.txt
          sf org login sfdx-url \
            --sfdx-url-file auth.txt \
            --alias TEST

      - name: Validate TEST Connection
        run: sf org display --target-org TEST

  # ---------------------------------------------------
  # 6. LOAD Validation
  # ---------------------------------------------------
  load-org-validation:
    runs-on: ubuntu-latest
    needs:
      - mandatory-checks
      - detect-context

    if: needs.detect-context.outputs.target_env == 'LOAD'

    steps:
      - uses: actions/checkout@v3

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate LOAD
        run: |
          echo "${{ secrets.SF_AUTH_LOAD }}" > auth.txt
          sf org login sfdx-url \
            --sfdx-url-file auth.txt \
            --alias LOAD

      - name: Validate LOAD Connection
        run: sf org display --target-org LOAD

  # ---------------------------------------------------
  # 7. Final Summary
  # ---------------------------------------------------
  summary:
    runs-on: ubuntu-latest

    needs:
      - detect-context
      - mandatory-checks
      - pr-title-validation
      - duplicate-metadata-check
      - basic-pmd
      - secret-scan
      - metadata-structure-validation
      - basic-lint
      - file-naming-validation
      - sfca-analyzer
      - risk-assessment
      - package-coverage
      - dev-risk-profile
      - sf-unit-test-gate
      - modified-class-coverage
      - test-org-validation
      - load-org-validation

    if: always()

    steps:
      - name: Print Summary
        run: |
          echo "Environment: ${{ needs.detect-context.outputs.target_env }}"
          echo "First PR: ${{ needs.detect-context.outputs.first_pr }}"
          echo "Validation Mode: ${{ needs.detect-context.outputs.validation_mode }}"
          echo "Enterprise PR Validation Completed"