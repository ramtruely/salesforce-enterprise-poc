name: SF PR Validation

on:
  pull_request:
    branches:
      - develop
      - release

jobs:

  # ---------------------------------------------------
  # 1. Detect Context
  # ---------------------------------------------------
  detect-context:
    runs-on: ubuntu-latest

    outputs:
      validation_mode: ${{ steps.validation-mode.outputs.mode }}
      target_env: ${{ steps.env-detect.outputs.env }}
      first_pr: ${{ steps.pr-detect.outputs.first_pr }}

    steps:
      - uses: actions/checkout@v3

      # -----------------------------------------------
      # Detect Environment
      # -----------------------------------------------
      - name: Detect Environment
        id: env-detect
        run: |
          if [ "${{ github.base_ref }}" == "develop" ]; then
            echo "env=TEST" >> $GITHUB_OUTPUT
          else
            echo "env=LOAD" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------
      # Detect First PR
      # -----------------------------------------------
      - name: Detect First PR
        id: pr-detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_COUNT=$(gh pr list \
            --base ${{ github.base_ref }} \
            --state merged \
            --json number \
            --jq length)

          echo "Merged PR Count: $PR_COUNT"

          if [ "$PR_COUNT" -eq 0 ]; then
            echo "first_pr=true" >> $GITHUB_OUTPUT
          else
            echo "first_pr=false" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------
      # Detect First Deployment
      # -----------------------------------------------
      - name: Check Deployment Cache
        id: cache-check
        uses: actions/cache@v4
        with:
          path: .deploy_marker_${{ steps.env-detect.outputs.env }}
          key: deploy-marker-${{ steps.env-detect.outputs.env }}-v1

      # -----------------------------------------------
      # Set Validation Mode
      # -----------------------------------------------
      - name: Set Validation Mode
        id: validation-mode
        run: |
          if [ "${{ steps.pr-detect.outputs.first_pr }}" == "true" ] || \
             [ "${{ steps.cache-check.outputs.cache-hit }}" != "true" ]; then

            echo "mode=bootstrap" >> $GITHUB_OUTPUT

          else
            echo "mode=full" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------
      # Debug Context
      # -----------------------------------------------
      - name: Debug Context
        run: |
          echo "Environment: ${{ steps.env-detect.outputs.env }}"
          echo "First PR: ${{ steps.pr-detect.outputs.first_pr }}"
          echo "Cache Hit: ${{ steps.cache-check.outputs.cache-hit }}"
          echo "Validation Mode: ${{ steps.validation-mode.outputs.mode }}"

  # ---------------------------------------------------
  # 2. Mandatory Checks
  # ---------------------------------------------------
  mandatory-checks:
    runs-on: ubuntu-latest
    needs: detect-context

    steps:
      - uses: actions/checkout@v3

      - name: Commit Message Validation
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "$TITLE" | grep -E "^(feat|fix|chore|test|refactor):" || exit 1

      - name: YAML Validation
        run: echo "YAML validation passed"

      - name: Basic Validation
        run: echo "Basic validation passed"

      - name: Deployment Authentication Validation
        run: echo "Authentication validation passed"

  # ---------------------------------------------------
  # 3. Heavy Checks
  # ---------------------------------------------------

  package-coverage:
    runs-on: ubuntu-latest
    needs: [detect-context, mandatory-checks]
    if: needs.detect-context.outputs.validation_mode == 'full'

    steps:
      - name: Package Coverage Check
        run: echo "Running package coverage"

  risk-assessment:
    runs-on: ubuntu-latest
    needs: [detect-context, mandatory-checks]
    if: needs.detect-context.outputs.validation_mode == 'full'

    steps:
      - name: Calculate Risk Assessment
        run: echo "Running risk assessment"

  dev-risk-profile:
    runs-on: ubuntu-latest
    needs: [detect-context, mandatory-checks]
    if: needs.detect-context.outputs.validation_mode == 'full'

    steps:
      - name: Dev Risk Profile
        run: echo "Running dev risk profile"

  sfca-analyzer:
    runs-on: ubuntu-latest
    needs: [detect-context, mandatory-checks]
    if: needs.detect-context.outputs.validation_mode == 'full'

    steps:
      - name: SFCA Analyzer
        run: echo "Running SFCA analyzer"

  sf-unit-test-gate:
    runs-on: ubuntu-latest
    needs: [detect-context, mandatory-checks]
    if: needs.detect-context.outputs.validation_mode == 'full'

    steps:
      - name: SF Unit Test Gate
        run: echo "Running SF unit test gate"

  modified-class-coverage:
    runs-on: ubuntu-latest
    needs: [detect-context, mandatory-checks]
    if: needs.detect-context.outputs.validation_mode == 'full'

    steps:
      - name: SF Coverage Gate for Modified Classes
        run: echo "Running modified class coverage"

  # ---------------------------------------------------
  # 4. Summary
  # ---------------------------------------------------
  summary:
    runs-on: ubuntu-latest

    needs:
      - detect-context
      - mandatory-checks
      - package-coverage
      - risk-assessment
      - dev-risk-profile
      - sfca-analyzer
      - sf-unit-test-gate
      - modified-class-coverage

    if: always()

    steps:
      - name: Print Summary
        run: |
          echo "Environment: ${{ needs.detect-context.outputs.target_env }}"
          echo "First PR: ${{ needs.detect-context.outputs.first_pr }}"
          echo "Validation Mode: ${{ needs.detect-context.outputs.validation_mode }}"
          echo "PR Validation Completed"